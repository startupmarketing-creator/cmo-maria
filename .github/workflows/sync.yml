name: Sync from Notion

on:
  repository_dispatch:
    types: [sync-site]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install @notionhq/client
      - name: Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node .github/scripts/sync.js
      - name: Commit
        run: |
          git config user.name "CMO Sync"
          git config user.email "sync@cmo.bio"
          git add site.json
          git diff --staged --quiet || git commit -m "Sync from Notion"
          git push
